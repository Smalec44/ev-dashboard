name: quality

# The same gate the pre-commit hook runs locally, enforced where the hook
# cannot be skipped: every push and every pull request against main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run analyze
      - run: npm test
      - run: npm run build
        env:
          # No telemetry from CI, and no attempt to reach the network for it.
          NEXT_TELEMETRY_DISABLED: "1"
